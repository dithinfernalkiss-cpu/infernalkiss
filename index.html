<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>INFERNAL KISS — Official Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-font: 'Cinzel', serif;
            --secondary-font: 'Inter', sans-serif;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background: #000;
            color: var(--accent);
            font-family: var(--secondary-font);
            overflow-x: hidden;
        }

        /* Latar Belakang Video */
        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }

        /* HEADER: Ikon 3 Baris & Logo di Sisi Kiri */
        header {
            padding: 30px 50px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1002;
            box-sizing: border-box;
        }

        .menu-trigger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-right: 25px;
        }

        .menu-trigger span {
            display: block; width: 25px; height: 1px; background: #fff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 35px;
            width: auto;
        }

        .logo-text {
            font-family: var(--primary-font);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* SIDEBAR NAV: Tersembunyi di Kiri */
        .nav-sidebar {
            position: fixed;
            top: 0; left: -100%;
            width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            transition: 0.5s cubic-bezier(0.77,0,0.175,1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .nav-sidebar.active { transform: translateX(100%); }

        .nav-sidebar a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--primary-font);
            opacity: 0.6;
            transition: 0.3s;
        }

        .nav-sidebar a:hover { opacity: 1; padding-left: 10px; }

        /* AREA UTAMA: Headline & Bio */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: var(--primary-font);
            font-size: 2.8rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
        }

        .hero .bio {
            max-width: 500px;
            margin: 20px 0;
            font-size: 0.85rem;
            letter-spacing: 2px;
            line-height: 1.8;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .hero .btn-link {
            margin-top: 20px;
            padding: 12px 40px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            text-decoration: none;
            font-family: var(--primary-font);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: 0.4s;
        }

        .hero .btn-link:hover {
            background: var(--accent);
            color: #000;
        }

        /* BAGIAN BAWAH (SUBSCRIBE) */
        .subscribe-section {
            padding: 120px 20px;
            text-align: center;
            background: rgba(0,0,0,0.4);
        }

        .subscribe-section h2 {
            font-family: var(--primary-font);
            font-size: 1.3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subscribe-section p {
            max-width: 550px;
            margin: 15px auto;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .email-form {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .email-form input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 15px;
            color: #fff;
            width: 220px;
            font-size: 0.8rem;
        }

        .email-form button {
            background: #fff;
            color: #000;
            border: none;
            padding: 0 25px;
            text-transform: uppercase;
            font-family: var(--primary-font);
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            padding: 60px;
            text-align: center;
            border-top: 1
