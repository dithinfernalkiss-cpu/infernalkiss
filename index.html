<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>INFERNAL KISS — Elite Brand Identity</title>
    
    <!-- Google Fonts: Gothic Style -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gothic-font: 'UnifrakturMaguntia', cursive;
            --clean-font: 'Space Mono', monospace;
            --accent: #ffffff;
            --bg: #080808;
        }

        body {
            background: var(--bg);
            color: var(--accent);
            font-family: var(--clean-font);
            margin: 0;
            overflow-x: hidden;
        }

        /* Video Background */
        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
            filter: grayscale(100%) contrast(1.2);
        }

        /* Gothic Header */
        header {
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-family: var(--gothic-font);
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        /* Nav Baris Tiga (Hamburger) Custom */
        .nav-container {
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #888;
        }

        /* Main Section */
        main {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            font-family: var(--gothic-font);
            font-size: 5rem;
            margin-bottom: 0;
        }

        /* Bundle Display (APEX PREDATORS) */
        .bundle-preview {
            margin-top: 3rem;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            max-width: 500px;
        }

        .cta-button {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            transition: 0.3s;
            font-weight: bold;
        }

        .cta-button:hover {
            background: var(--accent);
            color: var(--bg);
        }

        footer {
            position: fixed;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .payment-info {
            margin-top: 1rem;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .nav-links { display: none; } /* Akang bisa aktifkan JS untuk menu baris tiga nanti */
        }
    </style>
</head>
<body>

    <!-- Video Background Realistic Silver Skull -->
    <video class="bg-video" autoPlay muted loop playsInline>
        <source src="/assets/skull-loop.mp4" type="video/mp4">
    </video>

    <header>
        <div class="logo">Infernal Kiss</div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="https://99designs.com/profiles/infernalkiss">1-to-1 Project</a>
            <a href="https://gumroad.com/infernalkiss">Digital Assets</a>
            <a href="mailto:email-akang@example.com">Contact</a>
        </nav>
    </header>

    <main>
        <h1 class="hero-title">Apex Predators</h1>
        <p>Elite Mascot Logo Bundle — Now Available</p>
        
        <div class="bundle-preview">
            <h3>Featured Bundle</h3>
            <p>High-contrast, aggressive animal subjects for international brands.</p>
            <a href="https://gumroad.com/l/apex-predators" class="cta-button">GET THE BUNDLE</a>
        </div>

        <div class="payment-info">ACCEPTED VIA: PAYPAL ONLY</div>
    </main>

    <footer>
        EST. 2010 — INFERNAL KISS GLOBAL STUDIO
    </footer>

</body>
</html>
