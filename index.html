<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>INFERNAL KISS — Elite Brand Identity</title>
    
    <!-- Google Fonts yang memiliki karakteristik serupa Trajan Pro (Cinzel & Cormorant) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-font: 'Cinzel', serif; /* Karakter kuat seperti Trajan */
            --secondary-font: 'Cormorant Garamond', serif; /* Elegan dan rapi */
            --accent: #ffffff;
            --bg: #000000;
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: var(--secondary-font);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5;
        }

        /* Navigasi Baris Tiga (Hamburger) */
        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--primary-font);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Menu Sederhana & Rapi */
        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: var(--primary-font);
            transition: 0.3s;
            opacity: 0.7;
        }

        .nav-links a:hover { opacity: 1; }

        /* Main Section */
        .content {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
        }

        .content h1 {
            font-family: var(--primary-font);
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 10px;
            text-transform: uppercase;
        }

        .content p {
            font-size: 1.2rem;
            max-width: 600px;
            font-style: italic;
            opacity: 0.8;
        }

        .cta-box {
            margin-top: 30px;
        }

        .btn {
            border: 1px solid var(--accent);
            padding: 12px 35px;
            color: var(--accent);
            text-decoration: none;
            font-family: var(--primary-font);
            font-size: 0.7rem;
            letter-spacing: 3px;
            transition: 0.4s;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .footer-payment {
            position: fixed;
            bottom: 40px;
            left: 50px;
            font-family: var(--primary-font);
            font-size: 0.6rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <video class="bg-video" autoPlay muted loop playsInline>
        <source src="/assets/skull-loop.mp4" type="video/mp4">
    </video>

    <header>
        <div class="logo">Infernal Kiss</div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="https://99designs.com/profiles/infernalkiss">1-to-1 Project</a>
            <a href="https://gumroad.com/infernalkiss">Digital Assets</a>
            <a href="mailto:email-akang@example.com">Contact</a>
        </nav>
    </header>

    <div class="content">
        <h1>Apex Predators</h1>
        <p>Premium Mascot Logo Bundle. Designed for high-contrast brand identity.</p>
        <div class="cta-box">
            <a href="https://gumroad.com/l/apex-predators" class="btn">PURCHASE VIA PAYPAL</a>
        </div>
    </div>

    <div class="footer-payment">
        ACCEPTED: PAYPAL ONLY | EST. 2010
    </div>

</body>
</html>
