        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;

            z-index: -1;
            opacity: 0.5;
        }

        header {
            padding: 30px;
            display: flex;
            justify-content: space-between;

        .logo {
            font-size: 1.5rem;
            letter-spacing: 4px;

        /* Ikon Baris Tiga */
        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;

        }

        .menu-icon span {
            display: block;
            width: 30px;
            height: 2px;
            background: #fff;
            transition: 0.3s;
        }

        /* Menu Samping (Overlay) */
        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%; /* Sembunyi di kiri */
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .nav-overlay.active {
            right: 0; /* Muncul saat aktif */
        }

        .nav-overlay a {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .nav-overlay a:hover { opacity: 1; }

        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;

        }

</head>
