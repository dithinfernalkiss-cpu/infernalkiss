<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>INFERNAL KISS — Official Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-font: 'Cinzel', serif;
            --secondary-font: 'Inter', sans-serif;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background: #000;
            color: var(--accent);
            font-family: var(--secondary-font);
            overflow-x: hidden;
        }

        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }

        /* HEADER */
        header {
            padding: 30px 50px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1002;
            box-sizing: border-box;
        }

        .menu-trigger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-right: 25px;
        }

        .menu-trigger span {
            display: block; width: 25px; height: 1px; background: #fff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 35px;
            width: auto;
        }

        .logo-text {
            font-family: var(--primary-font);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* SIDEBAR NAV */
        .nav-sidebar {
            position: fixed;
            top: 0; left: -100%;
            width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            transition: 0.5s cubic-bezier(0.77,0,0.175,1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .nav-sidebar.active { transform: translateX(100%); }

        .nav-sidebar a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--primary-font);
            opacity: 0.6;
            transition: 0.3s;
        }

        .nav-sidebar a:hover { opacity: 1; padding-left: 10px; }

        /* HERO AREA - Headline & Bio */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Headline Diperkecil */
        .hero h1 {
            font-family: var(--primary-font);
            font-size: 2.8rem; /* Ukuran lebih kecil sesuai permintaan */
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Bio Section */
        .hero .bio {
            max-width: 500px;
            margin: 20px 0;
            font-size: 0.85rem;
            letter-spacing: 2px;
            line-height: 1.8;
            opacity: 0.7;
            text-transform: uppercase;
        }
