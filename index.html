<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>INFERNAL KISS — Official Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5;
        }

        /* HEADER: Ikon 3 Baris & Logo di Sisi Kiri */
        header {
            padding: 40px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1002;
        }

        /* Tombol 3 Baris (Pemicu) */
        .menu-trigger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-right: 30px; /* Jarak antara ikon dan logo */
        }

        .menu-trigger span {
            display: block;
            width: 28px;
            height: 1px;
            background: #fff;
            transition: 0.3s;
        }

        .logo {
            font-size: 1.4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* MENU SIDEBAR: Tersembunyi di Kiri (-100%) */
        .nav-sidebar {
            position: fixed;
            top: 0;
            left: -100%; /* Sembunyi total */
            width: 320px;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            transition: transform 0.5s cubic-bezier(0.77,0,0.175,1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Saat Aktif: Menu Bergeser Masuk */
        .nav-sidebar.active {
            transform: translateX(100%);
        }

        .nav-sidebar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            margin: 18px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .nav-sidebar a:hover {
            opacity: 1;
            padding-left: 10px;
        }

        /* Area Hero */
        .hero {
            height: 70vh;
            display: flex;
            align-items: center;
            padding-left: 10%;
        }

        h1 {
            font-size: 5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 0;
        }
    </style>
</head>
<body>

    <video class="bg-video" autoPlay muted loop playsInline>
        <source src="/assets/skull-loop.mp4" type="video/mp4">
    </video>

    <header>
        <div class="menu-trigger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="logo">Infernal Kiss</div>
    </header>

    <nav class="nav-sidebar" id="sidebar">
        <a href="/" onclick="toggleMenu()">Home</a>
        <a href="https://99designs.com/profiles/infernalkiss" target="_blank">1-to-1 Project</a>
        <a href="https://gumroad.com/infernalkiss" target="_blank">Digital Assets</a>
        <a href="mailto:email-akang@domain.com">Contact</a>
    </nav>

    <div class="hero">
        <h1>Apex Predators</h1>
    </div>

    <script>
        function toggleMenu() {
            // Memberikan perintah pada sidebar untuk muncul/sembunyi
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>

</body>
</html>
